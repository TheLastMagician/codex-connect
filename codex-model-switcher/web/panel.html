<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>供应商与模型</title><style>/* STYLES */</style></head>
<body><main>
  <header><div><h1>供应商与模型</h1><p class="subtitle">新建会话，或修改已有会话的模型。</p></div><button id="refresh" class="quiet" type="button">刷新</button></header>
  <nav class="mode-switch" aria-label="会话操作"><button id="mode-create" type="button" aria-pressed="true" disabled>新建会话</button><button id="mode-edit" type="button" aria-pressed="false" disabled>修改已有会话</button></nav>
  <section id="create-section" aria-labelledby="create-heading">
    <div class="section-heading"><h2 id="create-heading">模型</h2></div>
    <form id="create-form">
      <div class="field-row"><label for="provider">供应商</label><div class="field-control">
        <select id="provider" required disabled><option value="">正在读取…</option></select><p id="endpoint" class="hint"></p>
      </div></div>
      <div class="field-row"><label for="model">模型</label><div class="field-control">
        <div class="inline-controls"><select id="model" required disabled><option value="">正在读取…</option></select><button class="text" id="reload-models" type="button">刷新</button></div>
        <label class="check"><input type="checkbox" id="manual">手动填写模型 ID</label>
        <input id="manual-model" aria-label="模型 ID" placeholder="完整模型 ID" hidden>
      </div></div>
      <div class="field-row"><label for="effort">思考强度</label><div class="field-control">
        <select id="effort"><option value="xhigh">xhigh</option></select><p class="hint" id="effort-note">按所选值请求供应商。</p>
      </div></div>
      <div class="section-heading group-gap"><h2>新会话</h2></div>
      <div class="field-row"><label for="project">所属项目</label><div class="field-control">
        <select id="project" required disabled><option value="">正在读取 Codex 项目…</option></select><p id="project-source" class="hint"></p>
      </div></div>
      <div class="field-row"><label for="cwd">工作目录</label><div class="field-control">
        <select id="cwd" required disabled><option value="">请先选择项目</option></select>
      </div></div>
      <div class="field-row"><label for="title">会话标题</label><div class="field-control"><input id="title" required maxlength="100" placeholder="新会话"></div></div>
      <div class="actions"><div class="selection" id="selection">正在读取配置…</div><button id="create" class="primary" type="submit" disabled>新建会话</button></div>
      <p class="hint footnote">新会话会保存到所选项目。</p>
    </form>
  </section>
  <section id="edit-section" aria-labelledby="edit-heading" hidden>
    <div class="section-heading"><h2 id="edit-heading">修改已有会话模型</h2></div>
    <form id="edit-form">
      <div class="field-row"><label for="edit-provider">会话原供应商</label><div class="field-control"><select id="edit-provider" disabled></select><p class="hint">选择该会话原来的供应商。</p></div></div>
      <div class="field-row"><label for="edit-thread">已有会话</label><div class="field-control"><select id="edit-thread" disabled><option value="">请选择会话</option></select><div class="inline-controls"><button id="reload-threads" class="text" type="button">刷新列表</button><button id="more-threads" class="text" type="button" hidden>加载更多</button></div><p id="thread-source" class="hint"></p></div></div>
      <div class="field-row"><label for="edit-ref">会话链接或 ID</label><div class="field-control"><input id="edit-ref" required placeholder="codex://threads/…" maxlength="200" autocomplete="off"><p class="hint">选择会话后自动填入，也可以直接粘贴其他会话的链接。</p></div></div>
      <div class="field-row"><label for="edit-model">修改为模型</label><div class="field-control"><input id="edit-model" required value="qwen3.8-27b" maxlength="160" spellcheck="false"></div></div>
      <div class="field-row"><label for="edit-effort">思考强度</label><div class="field-control"><select id="edit-effort"><option value="xhigh">xhigh</option></select></div></div>
      <div class="actions"><div class="selection">保留原会话的上下文和项目。</div><button id="edit-submit" class="primary" type="submit" disabled>修改并确认模型</button></div>
      <p class="hint footnote">会打开所选会话并核对设置。定时任务的配置保持原样。</p>
    </form>
    <div id="edit-result" class="result" hidden aria-live="polite"><h2>修改结果</h2><p id="edit-result-text" class="hint"></p><a id="edit-result-link">打开该会话</a></div>
  </section>
  <section class="result" id="result" hidden aria-live="polite"><p class="section-caption">最近创建</p><h2 id="result-title"></h2><dl id="result-data"></dl><p id="result-note" class="hint"></p><button id="complete" type="button">打开并确认模型</button></section>
  <details id="advanced" class="advanced"><summary>模型来源与高级设置</summary><div class="advanced-content">
    <p id="model-source" class="hint"></p>
    <h2>原生模型菜单</h2><p class="hint">如果会话输入框仍显示 GPT，可尝试将所选模型加入原生菜单。插件会先检查版本兼容性，再显示处理结果。</p>
    <button id="native" type="button" disabled>加入原生模型菜单</button><p id="native-note" class="hint" aria-live="polite"></p>
  </div></details>
  <div id="status" role="status" aria-live="polite"></div>
</main><script>/* SCRIPT */</script></body></html>
